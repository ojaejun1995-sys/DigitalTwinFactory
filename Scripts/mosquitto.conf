# Mosquitto configuration for DigitalTwinFactory
# Usage: mosquitto -c mosquitto.conf -v
#
# Only the plain MQTT listener is enabled here. UE5 does NOT connect directly
# to Mosquitto — it connects to ws_bridge.js (port 9001), which speaks MQTT
# with Mosquitto on 1883 and exposes a plain-JSON WebSocket to UE5.

persistence false
allow_anonymous true

listener 1883 0.0.0.0
protocol mqtt
